[package]
name = "andy-runtime"
version = "0.0.0"
description = "The machine the game runs on: loader, execution loop and the replacement for the Windows API"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
andy-cpu = { path = "../cpu" }
andy-mpeg = { path = "../mpeg" }
andy-recomp = { path = "../recomp" }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
bytemuck = { version = "1", features = ["derive"] }
fontdue = "0.9"
ttf-parser = "0.25"
