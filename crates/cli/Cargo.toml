[package]
name = "andy"
version = "0.0.0"
description = "Command-line front end: analyse the executable, test the semantics, run the game"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "andy"
path = "src/lib.rs"

[[bin]]
name = "andy"
path = "src/main.rs"

[dependencies]
andy-recomp = { path = "../recomp" }
andy-gpu = { path = "../gpu" }
andy-mpeg = { path = "../mpeg" }
andy-runtime = { path = "../runtime" }
fontdue = "0.9"
pollster = "1"
# The sound device, through the PulseAudio server: no system library needed.
serde_json = "1"
png = "0.17"
# Without the frame winit draws by itself on Wayland ("wayland-csd-adwaita"):
# its sub-surfaces crash the compositor of WSLg (docs/BACKLOG.md). The
# window draws its own (ADR 0018).
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

# The sound device: the PulseAudio server on Linux, the system's own
# interface elsewhere (ADR 0019).
[target.'cfg(unix)'.dependencies]
pulseaudio = "0.3"

[target.'cfg(not(unix))'.dependencies]
cpal = "0.15"

# A real joypad (ADR 0021). On Linux the crate wants the system's libudev
# headers, which this project does not ask to be installed.
[target.'cfg(windows)'.dependencies]
gilrs = "0.11"
